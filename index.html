<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAIIB PREP — Indian Economy MCQ Practice</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;
  --red:#f85149;--gold:#d29922;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.top{height:64px;border-bottom:1px solid var(--border);background:#010409;display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:10}
.logo{width:34px;height:34px;border-radius:50%;background:#f0f6fc;color:#0d1117;display:grid;place-items:center;font-weight:900;font-size:19px;margin-right:12px}
.brand{font-weight:650;font-size:16px}.brand span{color:var(--muted);font-weight:400}
.topstats{margin-left:auto;display:flex;gap:9px;align-items:center}
.badge{border:1px solid var(--border);background:#161b22;padding:6px 10px;border-radius:8px;color:var(--muted);font-size:12px}
.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 64px)}
.sidebar{border-right:1px solid var(--border);padding:22px 14px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.sidebar h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 10px 12px}
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.qbtn{height:32px;border:1px solid var(--border);background:#161b22;color:var(--muted);border-radius:6px;cursor:pointer;font-size:11px}
.qbtn:hover{border-color:var(--blue);color:var(--text)}
.qbtn.current{border-color:var(--blue);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.qbtn.correct{background:rgba(63,185,80,.13);border-color:rgba(63,185,80,.55);color:#7ee787}
.qbtn.wrong{background:rgba(248,81,73,.13);border-color:rgba(248,81,73,.55);color:#ff7b72}
.main{padding:34px 32px 60px;max-width:850px;width:100%;margin:auto}
.progressbar{height:6px;background:#21262d;border-radius:99px;overflow:hidden;margin-bottom:26px}
.progress{height:100%;background:var(--blue);width:0;transition:.25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:9px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.question{font-size:21px;line-height:1.42;font-weight:600;margin:6px 0 24px}
.option{width:100%;text-align:left;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:9px;padding:14px 16px;margin:9px 0;cursor:pointer;display:flex;gap:13px;transition:.14s;font-size:14px}
.option:hover:not(:disabled){border-color:#58a6ff;background:#21262d}
.option .letter{color:var(--blue);font-weight:800;min-width:21px}
.option.correct{border-color:var(--green);background:rgba(63,185,80,.12)}
.option.wrong{border-color:var(--red);background:rgba(248,81,73,.12)}
.option:disabled{cursor:default}
.feedback{display:none;border-radius:8px;padding:12px 14px;margin-top:15px;font-weight:650}
.feedback.show{display:block}.feedback.good{color:#7ee787;background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.35)}
.feedback.bad{color:#ff7b72;background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.35)}
.explain{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:4px}
.controls{display:flex;justify-content:space-between;margin-top:18px}
button.ctrl{border:1px solid var(--border);background:#21262d;color:var(--text);padding:9px 15px;border-radius:7px;cursor:pointer;font-weight:600}
button.ctrl:hover{border-color:var(--blue)}button.ctrl:disabled{opacity:.4;cursor:not-allowed}
.result{display:none;text-align:center}
.result h1{font-size:30px;margin:6px 0}.bigscore{font-size:64px;font-weight:800;color:var(--blue);margin:10px 0}
.result p{color:var(--muted)}
.restart{background:var(--blue)!important;color:#07101a!important;border-color:var(--blue)!important}
@media(max-width:760px){
 .layout{display:block}.sidebar{display:none}.main{padding:20px 14px 50px}
 .top{padding:0 14px}.topstats .hide-mobile{display:none}.card{padding:20px}
 .question{font-size:18px}
}
</style>
</head>

const letters = ["A","B","C","D"];
let current = 0;
let answers = Array(questions.length).fill(null);
let score = 0;

const $ = id => document.getElementById(id);
const qgrid = $("qgrid");

questions.forEach((_,i) => {
  const b = document.createElement("button");
  b.className = "qbtn";
  b.textContent = i+1;
  b.onclick = () => { current=i; render(); };
  qgrid.appendChild(b);
});

function render(){
  $("quiz").style.display = "block";
  $("result").style.display = "none";
  const item = questions[current];
  $("position").textContent = `Question ${current+1} of ${questions.length}`;
  $("percent").textContent = `${Math.round((current/questions.length)*100)}% complete`;
  $("progress").style.width = `${(current/questions.length)*100}%`;
  $("question").textContent = item.q;
  const box = $("options");
  box.innerHTML = "";
  const selected = answers[current];

  item.o.forEach((opt,i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerHTML = `<span class="letter">${letters[i]}.</span><span>${escapeHtml(opt)}</span>`;
    if(selected !== null){
      btn.disabled = true;
      if(i === item.a) btn.classList.add("correct");
      if(i === selected && selected !== item.a) btn.classList.add("wrong");
    } else {
      btn.onclick = () => choose(i);
    }
    box.appendChild(btn);
  });

  const fb = $("feedback");
  fb.className = "feedback";
  if(selected !== null){
    fb.classList.add("show", selected === item.a ? "good" : "bad");
    fb.innerHTML = selected === item.a
      ? "✓ Correct!"
      : `✗ Incorrect. The correct answer is <b>${letters[item.a]}. ${escapeHtml(item.o[item.a])}</b>.`;
    const ex = document.createElement("span");
    ex.className = "explain";
    ex.textContent = getExplanation(current);
    fb.appendChild(ex);
  }

  $("prev").disabled = current === 0;
  $("next").textContent = current === questions.length-1 ? "Finish →" : "Next →";
  updateStats();
  updateGrid();
}

function choose(i){
  if(answers[current] !== null) return;
  answers[current] = i;
  if(i === questions[current].a) score++;
  render();
}

function next(){
  if(current < questions.length-1){ current++; render(); }
  else showResult();
}
function prev(){
  if(current>0){ current--; render(); }
}
function updateStats(){
  $("score").textContent = score;
  $("answered").textContent = answers.filter(x=>x!==null).length;
}
function updateGrid(){
  [...qgrid.children].forEach((b,i)=>{
    b.className = "qbtn";
    if(i===current) b.classList.add("current");
    if(answers[i] !== null) b.classList.add(answers[i]===questions[i].a ? "correct" : "wrong");
  });
}
function showResult(){
  $("quiz").style.display = "none";
  $("result").style.display = "block";
  $("progress").style.width = "100%";
  $("position").textContent = "Quiz complete";
  $("percent").textContent = "100% complete";
  $("finalScore").textContent = `${score} / ${questions.length}`;
  const pct = Math.round(score/questions.length*100);
  $("finalText").textContent = `You scored ${pct}%. ${pct>=80 ? "Excellent JAIIB readiness." : pct>=60 ? "Good foundation — revise the missed concepts." : "Keep practising and revisit the high-yield concepts."}`;
}
function restart(){
  current=0; answers=Array(questions.length).fill(null); score=0; render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

  if(e.key==="ArrowRight") next();
  if(e.key==="ArrowLeft") prev();
});
